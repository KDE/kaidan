Dependencies:
  - 'on': ['@all']
    require:
      frameworks/extra-cmake-modules: '@latest-kf6'
      frameworks/kcoreaddons: '@latest-kf6'
      frameworks/kio: '@latest-kf6'
      frameworks/kirigami: '@latest-kf6'
      frameworks/prison: '@latest-kf6'
      frameworks/kitemmodels: '@latest-kf6'
      libraries/kirigami-addons: '@latest-kf6'
      libraries/kquickimageeditor: '@latest-kf6'
      libraries/qxmpp: '@latest-kf6'
      third-party/kdsingleapplication: '@latest-kf6'

  - 'on': ['Linux', 'FreeBSD', 'Windows', 'macOS']
    require:
      frameworks/kcrash: '@latest-kf6'
      frameworks/kwindowsystem: '@latest-kf6'

Options:
  require-passing-tests-on: ['@all']
  require-cppcheck-clean: true
  clang-format-versions: [19]
  cppcheck-arguments:
    # These signatures are fixed by QAbstractItemModel, and by the accountJid/chatJid pair every other lookup uses.
    - '--suppress=shadowFunction:src/FileModel.cpp'
    - '--suppress=shadowFunction:src/GroupChatUserModel.cpp'
    # The stub implementations used without KNotifications ignore their arguments, unlike the real ones.
    - '--suppress=functionStatic:src/NotificationController.cpp'
    # cppcheck cannot parse Qt's _s literal applied to a raw string.
    - '--suppress=unknownMacro:src/InputValidator.cpp'
